<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 최적화를 위한 뷰포트 설정 (잘림 방지 및 노치 영역 대응) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>디지털 명함</title>
    
    <!-- 연결 속도 향상을 위한 Preconnect (구글 서버 조기 연결) -->
    <link rel="preconnect" href="https://docs.google.com">
    <link rel="preconnect" href="https://drive.google.com">
    
    <!-- Tailwind CSS (스타일링) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons (미래지향적이고 깔끔한 아이콘) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class', // 클래스 기반 다크모드 설정
            theme: {
                extend: {
                    colors: {
                        primary: '#0055ff', // 선명한 블루 포인트
                        primaryLight: '#3377ff',
                        darkbg: '#0B1120', // 깊고 깔끔한 다크 네이비
                        lightbg: '#f8fafc',
                    },
                    fontFamily: {
                        sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'Helvetica Neue', 'Segoe UI', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        /* 웹폰트 로드 (프리텐다드) */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body {
            /* 라이트/다크 모드 기본 배경 트랜지션 */
            transition: background-color 0.3s ease, color 0.3s ease;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
            /* 모바일 브라우저 UI에 가려지는 현상 방지 (100dvh) 및 잘림 방지 스크롤 허용 */
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 기기 크기에 상관없이 항상 중앙 정렬 */
            padding: 12px; /* 상하좌우 여백 최소화 */
            box-sizing: border-box;
        }

        /* 다크모드 배경 */
        .dark body {
            background-color: #0B1120;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 85, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(51, 119, 255, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
        }

        /* 라이트모드 배경 */
        html:not(.dark) body {
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 85, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 85, 255, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: #0f172a;
        }

        /* 글래스모피즘 공통 */
        .glass-card {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* 다크모드 카드 */
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 라이트모드 카드 */
        html:not(.dark) .glass-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 25px 50px -12px rgba(0, 85, 255, 0.15);
        }

        .glass-button {
            transition: all 0.2s ease;
        }
        
        /* 다크모드 버튼 */
        .dark .glass-button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .dark .glass-button:active {
            background: rgba(0, 85, 255, 0.2);
            transform: scale(0.96);
            border-color: rgba(0, 85, 255, 0.5);
        }

        /* 라이트모드 버튼 */
        html:not(.dark) .glass-button {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }
        html:not(.dark) .glass-button:active {
            background: rgba(0, 85, 255, 0.1);
            transform: scale(0.96);
            border-color: rgba(0, 85, 255, 0.3);
        }

        /* 로딩 스피너 */
        .loader {
            border: 3px solid rgba(128,128,128,0.2);
            border-top-color: #0055ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 공지사항 펄스 */
        .pulse-border {
            animation: pulse-border 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-border {
            0%, 100% { border-color: rgba(0, 85, 255, 0.2); }
            50% { border-color: rgba(0, 85, 255, 0.8); }
        }

        /* 스크롤바 숨기기 (작은 기기에서 스크롤 발생 시 지저분함 방지) */
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="antialiased">

    <!-- 메인 디지털 명함 컨테이너 (한 화면에 꽉 차게 여백 및 크기 대폭 축소) -->
    <main id="vcard-container" class="opacity-0 transition-opacity duration-500 w-full max-w-[380px] max-h-[96dvh] overflow-y-auto hide-scroll glass-card rounded-[24px] p-4 sm:p-5 flex flex-col relative my-auto shadow-2xl">
        
        <!-- 최상단 로고 -->
        <div class="flex justify-center mb-3 min-h-[40px] items-center">

            <h2 id="el-company" class="text-[13px] font-medium text-slate-500 dark:text-slate-400 tracking-wide mb-1 hidden"></h2>

        <div id="el-notice-container" class="hidden mb-4 bg-white dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 pulse-border relative overflow-hidden shadow-sm">
            <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>

        <!-- 액션 버튼 그리드 -->
        <div class="grid grid-cols-2 gap-2 mb-4">

                <div class="bg-slate-100 dark:bg-slate-800/80 p-2 rounded-full mb-1 group-hover:bg-primary group-hover:text-white transition-colors shadow-inner">

            <!-- 이메일 -->
            <a id="btn-email" href="#" class="glass-button hidden flex flex-col items-center justify-center py-2.5 rounded-[16px] text-slate-700 dark:text-slate-300 group">
                <div class="bg-slate-100 dark:bg-slate-800/80 p-2 rounded-full mb-1 group-hover:bg-primary group-hover:text-white transition-colors shadow-inner">
                    <i class="ph-fill ph-envelope-simple text-lg group-hover:text-white text-primary dark:text-white"></i>
                </div>
                <span class="text-[10px] font-bold tracking-wide text-slate-400 dark:text-slate-500 mb-0.5">이메일</span>

        <!-- 추가 링크 버튼 리스트 -->
        <div class="space-y-2 mb-4">
            <!-- 카카오톡 -->
            <a id="btn-kakao" href="#" target="_blank" rel="noopener noreferrer" class="glass-button hidden w-full flex items-center justify-between p-2.5 rounded-xl text-slate-800 dark:text-slate-200 hover:border-primary/50">
                <div class="flex items-center gap-2 overflow-hidden">
                    <div class="min-w-[36px] h-9 rounded-full bg-[#FEE500] flex items-center justify-center text-black shadow-sm">

            <!-- 홈페이지 -->
            <a id="btn-homepage" href="#" target="_blank" rel="noopener noreferrer" class="glass-button hidden w-full flex items-center justify-between p-2.5 rounded-xl text-slate-800 dark:text-slate-200 hover:border-primary/50">
                <div class="flex items-center gap-2 overflow-hidden">
                    <div class="min-w-[36px] h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center shadow-inner">
                        <i class="ph-fill ph-globe text-xl text-primary"></i>
                    </div>
                    <div class="flex flex-col overflow-hidden">
                        <span class="font-bold text-[13px]">홈페이지 방문</span>
                        <span id="text-homepage" class="text-[11px] text-slate-500 dark:text-slate-400 truncate mt-0.5"></span>

            <!-- 블로그 -->
            <a id="btn-blog" href="#" target="_blank" rel="noopener noreferrer" class="glass-button hidden w-full flex items-center justify-between p-2.5 rounded-xl text-slate-800 dark:text-slate-200 hover:border-primary/50">
                <div class="flex items-center gap-2 overflow-hidden">
                    <div class="min-w-[36px] h-9 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center shadow-inner">
                        <i class="ph-fill ph-notebook text-xl text-primary"></i>
                    </div>
                    <div class="flex flex-col overflow-hidden">
                        <span class="font-bold text-[13px]">블로그 보기</span>
                        <span id="text-blog" class="text-[11px] text-slate-500 dark:text-slate-400 truncate mt-0.5"></span>
                    </div>
                </div>
                <i class="ph-bold ph-caret-right text-slate-400 ml-1"></i>
            </a>
        </div>

        <!-- 명함 이미지 다운로드 버튼 -->
        <a id="btn-download" href="#" target="_blank" download class="hidden w-full mt-auto bg-primary hover:bg-primaryLight text-white transition-colors font-bold text-[14px] py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/30">
            <i class="ph-bold ph-download-simple text-lg"></i>
            명함 이미지 저장
        </a>

    </main>

    <script>
        // ================= 다크모드 / 라이트모드 토글 로직 =================
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        
        // 시스템 설정이나 로컬스토리지 확인하여 초기 테마 세팅
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeIcon.classList.replace('ph-moon', 'ph-sun');
        } else {
            document.documentElement.classList.remove('dark');
            themeIcon.classList.replace('ph-sun', 'ph-moon');
        }

        // 토글 버튼 클릭 이벤트
        themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                localStorage.theme = 'dark';
                themeIcon.classList.replace('ph-moon', 'ph-sun');
            } else {
                localStorage.theme = 'light';
                themeIcon.classList.replace('ph-sun', 'ph-moon');
            }
        });


        // ================= 데이터 연동 로직 =================
        const SHEET_ID = '17Vp_ZG9o3D08QYYJq3cpOQAeQo6vAfL1v86uLQtc82Q'; 
        const SHEET_NAME = encodeURIComponent('데이터');
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${SHEET_NAME}`;

        // 간단한 CSV 파서
        function parseCSV(str) {
            const arr = [];
            let quote = false;
            for (let row = 0, col = 0, c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        }

        // 텍스트 데이터를 바인딩하는 함수
        function bindDataText(elementId, value) {
            const el = document.getElementById(elementId);
            if (el && value && value.trim() !== "") {
                el.innerText = value.trim();
                el.classList.remove('hidden');
                
                if (elementId === 'el-notice') {
                    document.getElementById('el-notice-container').classList.remove('hidden');
                }
            }
        }

        // 링크 및 표시 텍스트를 함께 바인딩하는 함수
        function bindLinkData(btnId, textId, value, prefix = "") {
            const btn = document.getElementById(btnId);
            const textEl = document.getElementById(textId);
            if (btn && value && value.trim() !== "") {
                btn.href = prefix + value.trim();
                btn.classList.remove('hidden');
                if (textEl) {
                    textEl.innerText = value.trim();
                }
            }
        }

        // 구글 드라이브 뷰어 링크를 직접 이미지 링크로 변환 (강화된 버전)
        function convertGoogleDriveLink(url) {
            if (!url) return "";
            let fileId = "";
            
            // 1. /file/d/[ID]/view 형태에서 ID 추출
            let match = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                fileId = match[1];
            } else {
                // 2. ?id=[ID] 형태에서 ID 추출
                match = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
                if (match && match[1]) {
                    fileId = match[1];
                }
            }

            if (fileId) {
                // 구글 드라이브 보안 정책을 우회하여 이미지를 렌더링하는 가장 안정적인 방법 (썸네일 API 사용)
                return `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
            }
            
            return url.trim();
        }

        // 데이터 렌더링
        function renderCard(data) {
            // A(0): 회사명, B(1): 슬로건, C(2): 직위, D(3): 이름, E(4): 전화, F(5): 이메일
            // G(6): 블로그, H(7): 홈페이지, I(8): 카카오, J(9): 공지사항, K(10): 명함저장, L(11): 로고
            
            bindDataText('el-company', data[0]);
            bindDataText('el-slogan', data[1]);
            bindDataText('el-title', data[2]);
            bindDataText('el-name', data[3]);
            bindDataText('el-notice', data[9]);

            // 로고 이미지 처리
            const logoEl = document.getElementById('el-logo');
            if (data[11] && data[11].trim() !== "") {
                logoEl.src = convertGoogleDriveLink(data[11]);
                logoEl.classList.remove('hidden');
            }

            // 연락처 및 링크 처리 (아이콘 텍스트와 실제 데이터 동시 표기)
            bindLinkData('btn-phone', 'text-phone', data[4], 'tel:');
            bindLinkData('btn-email', 'text-email', data[5], 'mailto:');
            bindLinkData('btn-blog', 'text-blog', data[6], '');
            bindLinkData('btn-homepage', 'text-homepage', data[7], '');
            bindLinkData('btn-kakao', 'text-kakao', data[8], '');
            
            // 다운로드 버튼 처리
            if (data[10] && data[10].trim() !== "") {
                const btnDl = document.getElementById('btn-download');
                btnDl.href = data[10].trim();
                btnDl.classList.remove('hidden');
            }
        }

        // 카드를 화면에 표시하는 함수
        function showCard() {
            document.getElementById('loading').style.display = 'none';
            const container = document.getElementById('vcard-container');
            container.classList.remove('hidden');
            // 약간의 딜레이 후 투명도 조절로 부드러운 전환 효과 (페이드인)
            setTimeout(() => {
                container.classList.remove('opacity-0');
            }, 50);
        }

        // 데이터 페칭 (캐싱 적용으로 접속 즉시 렌더링 구현)
        async function fetchSheetData() {
            const CACHE_KEY = 'vcard_data_cache';
            
            // 1. 로컬 스토리지에 저장된 캐시 데이터가 있다면 '즉시' 화면에 렌더링 (NFC 스캔 시 딜레이 제로)
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) {
                try {
                    renderCard(JSON.parse(cachedData));
                    showCard(); // 즉시 로딩 화면을 없애고 명함 출력
                } catch(e) { console.log("Cache error", e); }
            }

            // 2. 백그라운드에서 최신 데이터를 구글 시트에서 가져옴
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                
                const csvText = await response.text();
                const rows = parseCSV(csvText);
                
                if (rows.length > 1 && rows[1].length > 0) {
                    const freshData = rows[1];
                    
                    // 데이터가 변경되었거나 기존에 캐시가 없었을 경우 화면 및 캐시 업데이트
                    if (!cachedData || JSON.stringify(freshData) !== cachedData) {
                        renderCard(freshData);
                        localStorage.setItem(CACHE_KEY, JSON.stringify(freshData));
                    }
                    
                    // 만약 첫 접속(캐시 없음)이었다면 데이터를 불러온 후 화면을 보여줌
                    if (!cachedData) {
                        showCard();
                    }
                } else {
                    throw new Error("No data found in row 2");
                }
            } catch (error) {
                console.error("Failed to fetch data: ", error);
                if (!cachedData) {
                    // 캐시도 없고 가져오기도 실패한 경우 에러 표시
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error-message').classList.remove('hidden');
                }
            }
        }

        // 스크립트 실행
        window.addEventListener('DOMContentLoaded', fetchSheetData);

    </script>
</body>
</html>
